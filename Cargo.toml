[package]
name = "ttfx-rs"
version = "0.1.0"
edition = "2021"
authors = ["David Mireles <davidmirelesll@outlook.com>", "Louzt <louzt@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "High-performance Rust Terminal Text Effects (ttfx) library with 37+ ANSI text animations"
repository = "https://github.com/louzt/ttfx-rs"

[dependencies]
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
anstyle = "1.0"
unicode-width = "0.2"
