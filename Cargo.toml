[package]
name = "ttfx-rs"
version = "0.1.0"
edition = "2021"
authors = ["David Mireles <davidmirelesll@outlook.com>", "Louzt <louzt@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "High-performance Rust Terminal Text Effects engine with 38 physics-driven ANSI animations"
repository = "https://github.com/louzt/ttfx-rs"
homepage = "https://louzt.github.io/ttfx-rs/"
documentation = "https://docs.rs/ttfx-rs"
readme = "README.md"
keywords = ["terminal", "tui", "text-effects", "ansi", "matrix"]
categories = ["command-line-utilities", "rendering"]

[dependencies]
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
anstyle = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"
